version: "2"
run:
  concurrency: 8
  go: 1.22.0
output:
  sort-order:
    - linter
    - file
    - severity
linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - unused
    - wrapcheck
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - .*\.gen\.go$
      - .*\.ridl$
      - tools
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
